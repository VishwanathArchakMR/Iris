<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generic Form - SIH26171 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #1d4ed8; }
    #submitStatus {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    #submitStatus.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Generic Registration &amp; Feedback Form</h1>
    <p class="subtitle">Complete the fields below. Consequential submit actions require human approval.</p>

    <form id="genericForm" onsubmit="event.preventDefault(); handleGenericSubmit();">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="Residential address" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone number" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="3" placeholder="Enter feedback or comments" autocomplete="off"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Submit</button>
    </form>

    <div id="submitStatus"></div>
  </div>

  <script>
    function handleGenericSubmit() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const statusDiv = document.getElementById("submitStatus");
      statusDiv.className = "success";
      statusDiv.textContent = `Form submitted successfully for ${name} (${email})!`;
    }
  </script>
</body>
</html>
