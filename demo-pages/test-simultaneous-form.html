<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simultaneous Form Autofill Demo — SIH26171</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 40px auto;
      max-width: 650px;
      padding: 0 20px;
      color: #1e293b;
      background: #f8fafc;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: #334155;
    }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button.submit-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.submit-btn:hover {
      background: #1d4ed8;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: #e0f2fe;
      color: #0369a1;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">SIH26171 Simultaneous Form Test Page</div>
    <h2>Applicant Registration Form</h2>
    <p style="font-size: 13px; color: #64748b; margin-top: -8px; margin-bottom: 20px;">
      Instruct agent with <code>fill the form</code> or <code>fill the form, then click submit</code> to test simultaneous multi-field population from <code>form-profile.json</code>.
    </p>

    <form id="applicantForm" onsubmit="event.preventDefault(); alert('Form Submitted Successfully!');">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1-555-0199" />
      </div>

      <div class="form-group">
        <label for="organization">Organization / Institution</label>
        <input type="text" id="organization" name="organization" placeholder="Your company or university" />
      </div>

      <div class="form-group">
        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" placeholder="123 Main St" />
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="City" />
        </div>
        <div class="form-group">
          <label for="zip">Zip / Postal Code</label>
          <input type="text" id="zip" name="zip" placeholder="Zip code" />
        </div>
      </div>

      <div class="form-group">
        <label for="comments">Comments / Additional Notes</label>
        <textarea id="comments" name="comments" placeholder="Any additional notes or inquiry details"></textarea>
      </div>

      <button type="submit" id="submit-button" class="submit-btn">Submit Registration</button>
    </form>
  </div>
</body>
</html>
