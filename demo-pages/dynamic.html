<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Elements - SIH26171 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .btn {
      background: #2563eb;
      color: #ffffff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .dynamic-panel {
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dynamic Page State Demonstration</h1>
    <p class="subtitle">Validates closed-loop observation, dynamic DOM mutations, and change detection.</p>

    <div style="display: flex; gap: 10px;">
      <button type="button" id="btnRevealSection" class="btn" onclick="toggleAdvancedSection()">Show Advanced Options</button>
      <button type="button" id="btnAddNewField" class="btn btn-secondary" onclick="addNewField()">Add Custom Field</button>
    </div>

    <div id="advancedSection" class="dynamic-panel">
      <div style="font-weight: 700; font-size: 14px; margin-bottom: 12px; color: #1e293b;">Advanced Configuration Settings</div>
      <div class="form-group">
        <label for="apiKeyField">Access Key</label>
        <input type="text" id="apiKeyField" name="accessKey" placeholder="Enter key (kept local)" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="regionField">Server Region</label>
        <input type="text" id="regionField" name="region" placeholder="e.g. us-east, ap-south" autocomplete="off" />
      </div>
      <button type="button" id="btnApplyAdvanced" class="btn" style="margin-bottom: 0;" onclick="applySettings()">Apply Settings</button>
    </div>

    <div id="customFieldsContainer" style="margin-top: 14px;"></div>

    <div id="dynamicStatus" style="margin-top: 16px; padding: 10px; border-radius: 6px; background: #eff6ff; color: #1e40af; font-size: 13px; display: none;"></div>
  </div>

  <script>
    let fieldCount = 0;
    function toggleAdvancedSection() {
      const panel = document.getElementById("advancedSection");
      const btn = document.getElementById("btnRevealSection");
      if (panel.style.display === "none" || panel.style.display === "") {
        panel.style.display = "block";
        btn.textContent = "Hide Advanced Options";
        updateStatus("Advanced options revealed via dynamic DOM mutation.");
      } else {
        panel.style.display = "none";
        btn.textContent = "Show Advanced Options";
        updateStatus("Advanced options collapsed.");
      }
    }

    function addNewField() {
      fieldCount++;
      const container = document.getElementById("customFieldsContainer");
      const div = document.createElement("div");
      div.className = "form-group";
      div.innerHTML = `
        <label for="customField${fieldCount}">Custom Parameter ${fieldCount}</label>
        <input type="text" id="customField${fieldCount}" name="custom${fieldCount}" placeholder="Value for parameter ${fieldCount}" autocomplete="off" />
      `;
      container.appendChild(div);
      updateStatus(`Added dynamic field #${fieldCount} to the live DOM.`);
    }

    function applySettings() {
      updateStatus("Settings successfully applied and verified.");
    }

    function updateStatus(msg) {
      const el = document.getElementById("dynamicStatus");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
