<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login - SIH26171 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-login {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-login:hover { background: #1d4ed8; }
    .privacy-notice {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      font-size: 12px;
      color: #065f46;
      line-height: 1.4;
    }
    #loginStatus {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    #loginStatus.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Sign In to Portal</h1>
    <p class="subtitle">Secure authentication demo with on-device privacy guarantee.</p>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off" />
      </div>

      <button type="submit" id="btnLogin" class="btn-login">Sign In</button>
    </form>

    <div class="privacy-notice">
      <strong>Privacy Guard:</strong> The password field value is protected client-side and never extracted into perception context or transmitted across network.
    </div>

    <div id="loginStatus"></div>
  </div>

  <script>
    function handleLogin() {
      const user = document.getElementById("username").value;
      const statusDiv = document.getElementById("loginStatus");
      statusDiv.className = "success";
      statusDiv.textContent = `Signed in as ${user || "User"}.`;
    }
  </script>
</body>
</html>
