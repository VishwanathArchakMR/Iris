<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Portal - SIH26171 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="search"], input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
    }
    .btn-search {
      background: #2563eb;
      color: #ffffff;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-search:hover { background: #1d4ed8; }
    #searchResults {
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
      margin-top: 10px;
    }
    .result-item {
      padding: 10px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }
    .result-title { font-weight: 600; font-size: 14px; color: #1e293b; }
    .result-snippet { font-size: 12px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Search Portal</h1>
    <p class="subtitle">Search our database of light-weight browser agent resources.</p>

    <label for="searchQuery" style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Search Query</label>
    <div class="search-box">
      <input type="search" id="searchQuery" name="search" placeholder="Type search query here (e.g. laptops, vision)..." autocomplete="off" />
      <button type="button" id="btnSearch" class="btn-search" onclick="performSearch()">Search</button>
    </div>

    <div id="searchResults">
      <div style="font-size: 13px; color: #64748b; font-style: italic;">Enter a search term above and click Search.</div>
    </div>
  </div>

  <script>
    const CATALOG = [
      { title: "UltraBook Pro Laptop", category: "Hardware", desc: "High-performance laptop with 16-inch display, 32GB RAM." },
      { title: "Budget Student Laptop", category: "Hardware", desc: "Affordable 14-inch laptop optimized for web browsing and note taking." },
      { title: "On-Device Visual Perception Engine", category: "Research", desc: "Light-weight browser perception models for UI grounding without cloud APIs." },
      { title: "Local OCR Extraction Module", category: "Vision", desc: "WASM-based Tesseract OCR pipeline running entirely on-device." },
      { title: "Deterministic Safety Gate", category: "Safety", desc: "Precondition, postcondition, and human-in-the-loop authorization policy." }
    ];

    function performSearch() {
      const q = (document.getElementById("searchQuery").value || "").toLowerCase().trim();
      const resContainer = document.getElementById("searchResults");
      if (!q) {
        resContainer.innerHTML = `<div style="color: #dc2626; font-size: 13px;">Please enter a search query.</div>`;
        return;
      }
      const matches = CATALOG.filter(item => item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q));
      if (matches.length === 0) {
        resContainer.innerHTML = `<div style="font-size: 13px; color: #64748b;">No results found for "${q}".</div>`;
      } else {
        resContainer.innerHTML = `
          <div style="font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 10px;">Found ${matches.length} result(s) for "${q}":</div>
          ${matches.map(m => `
            <div class="result-item">
              <div class="result-title">${m.title} <span style="font-size: 11px; background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-weight: normal; margin-left: 6px;">${m.category}</span></div>
              <div class="result-snippet">${m.desc}</div>
            </div>
          `).join("")}
        `;
      }
    }

    document.getElementById("searchQuery").addEventListener("keydown", (e) => {
      if (e.key === "Enter") performSearch();
    });
  </script>
</body>
</html>
